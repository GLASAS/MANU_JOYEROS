<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Unificada de Comunicaciones</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans antialiased">

    <!-- MODAL DE LOGIN -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 border border-gray-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-indigo-600 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-lg shadow-indigo-200 mb-4">
                    <i class="fa-solid fa-tower-broadcast"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Omni-Comms</h2>
                <p class="text-sm text-gray-500 mt-1">Plataforma Unificada de Comunicaciones</p>
            </div>
            <form id="login-form" onsubmit="auth.handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Correo Electrónico</label>
                    <input type="email" id="login-email" required value="carlos@globallife.com" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Contraseña / Token</label>
                    <input type="password" id="login-pass" required value="admin123" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none transition-all">
                </div>
                <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md shadow-indigo-100 transition-all text-sm">
                    Iniciar Sesión
                </button>
            </form>
            <div class="mt-6 text-center text-xs text-gray-400">
                Roles soportados: Administrador, Operador, Consulta
            </div>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="app-container" class="flex h-screen overflow-hidden hidden">
        
        <!-- SIDEBAR / MENÚ LATERAL -->
        <aside id="sidebar" class="w-64 bg-slate-900 text-slate-300 flex flex-col transition-all duration-300 z-30">
            <div class="h-16 flex items-center px-6 bg-slate-950 text-white font-bold text-lg tracking-wider">
                <i class="fa-solid fa-tower-broadcast text-indigo-400 mr-3"></i> OMNI-COMMS
            </div>

            <!-- Navegación -->
            <nav id="sidebar-nav" class="flex-1 px-4 py-6 space-y-2 overflow-y-auto text-sm">
                <!-- Dinámico según rol -->
            </nav>

            <!-- Info de Usuario / Sesión -->
            <div class="p-4 bg-slate-950 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div id="user-avatar" class="w-9 h-9 rounded-full bg-indigo-600 flex items-center text-white justify-center font-bold text-xs">CC</div>
                    <div class="overflow-hidden">
                        <p id="user-name" class="text-xs font-medium text-white truncate">Carlos Corredor</p>
                        <p id="user-role" class="text-[10px] text-indigo-400 truncate">Administrador</p>
                    </div>
                </div>
                <button onclick="auth.logout()" title="Cerrar Sesión" class="text-slate-400 hover:text-red-400 transition-colors p-2">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- CONTENEDOR PRINCIPAL -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 z-20">
                <h1 id="page-title" class="text-xl font-bold text-gray-800">Dashboard General</h1>
                <span id="system-status" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
                    <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Sistema Operativo
                </span>
            </header>

            <main id="app-content" class="flex-1 overflow-y-auto p-8 bg-gray-50">
                <!-- Vistas dinámicas -->
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/utils/variables.js"></script>
    <script src="js/modules/import.js"></script>
    <script src="js/modules/contacts.js"></script>
    <script src="js/modules/templates.js"></script>
    <script src="js/modules/campaigns.js"></script>
    <script src="js/modules/gmail.js"></script>
    <script src="js/modules/history.js"></script>
    <script src="js/modules/dashboard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
