<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MANU JOYEROS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <h2>💎 MANU JOYEROS</h2>
            <p>Sistema Profesional de Inventario</p>
        </div>
        <form id="loginForm" onsubmit="intentarLogin(event)">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" required placeholder="Ingrese su usuario">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" id="btnIngresar">Ingresar al Sistema</button>
            <div id="mensajeError" class="error-msg"></div>
        </form>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        async function intentarLogin(event) {
            event.preventDefault();
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('btnIngresar');
            const errorDiv = document.getElementById('mensajeError');

            btn.disabled = true;
            btn.textContent = "Verificando...";
            errorDiv.textContent = "";

            const res = await API.llamar("login", { usuario, password }, "POST");

            if (res.status === "success") {
                localStorage.setItem("usuario_manu", JSON.stringify(res.usuario));
                window.location.href = "index.html"; // Redirigir al dashboard principal
            } else {
                errorDiv.textContent = res.message;
                btn.disabled = false;
                btn.textContent = "Ingresar al Sistema";
            }
        }
    </script>
</body>
</html>
