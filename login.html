<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MANU JOYEROS</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-container input {
            width: 100%;
            padding-right: 40px;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: #6b7280;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toggle-password:hover {
            color: var(--primary);
        }
        /* Estilo para la versión en el footer de la card */
        .login-footer-version {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: #9ca3af;
            border-top: 1px solid #f3f4f6;
            padding-top: 0.75rem;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <h2>💎 MANU JOYEROS</h2>
            <p>Sistema Profesional de Inventario</p>
        </div>
        <form id="loginForm" onsubmit="intentarLogin(event)">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" required placeholder="Ingrese su usuario">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-container">
                    <input type="password" id="password" required placeholder="••••••••">
                    <button type="button" class="toggle-password" id="btnTogglePass" onclick="togglePasswordVisibility()" title="Mostrar contraseña">
                        👁️
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="btnIngresar">Ingresar al Sistema</button>
            <div id="mensajeError" class="error-msg"></div>
        </form>
        <div class="login-footer-version">
            Versión V1.2 • MANU JOYEROS
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const btnToggle = document.getElementById('btnTogglePass');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                btnToggle.textContent = '🔒';
                btnToggle.title = 'Ocultar contraseña';
            } else {
                passwordInput.type = 'password';
                btnToggle.textContent = '👁️';
                btnToggle.title = 'Mostrar contraseña';
            }
        }

        async function intentarLogin(event) {
            event.preventDefault();
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('btnIngresar');
            const errorDiv = document.getElementById('mensajeError');

            btn.disabled = true;
            btn.textContent = "Verificando...";
            errorDiv.textContent = "";

            const res = await API.llamar("login", { usuario, password }, "POST");

            if (res.status === "success") {
                localStorage.setItem("usuario_manu", JSON.stringify(res.usuario));
                window.location.href = "index.html"; 
            } else {
                errorDiv.textContent = res.message;
                btn.disabled = false;
                btn.textContent = "Ingresar al Sistema";
            }
        }
    </script>
</body>
</html>
